name: Skill registry

# Signs the community skills with did:web:traxito.github.io:oosr and publishes the static
# registry, the DID document and the schemas to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:skills
      - name: Sign skills and build the registry
        env:
          OOSR_PUBLISHER_JWK: ${{ secrets.OOSR_PUBLISHER_JWK }}
        run: >
          node packages/cli/dist/bin.js registry build
          --skills skills
          --did did:web:traxito.github.io:oosr
          --base-url https://traxito.github.io/oosr
          --key-env OOSR_PUBLISHER_JWK
          --out site
      - run: cp .github/pages/index.html site/ && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
